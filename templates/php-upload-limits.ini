; Ajusté pour permettre les uploads massifs depuis la médiathèque admin.
; Les défauts PHP (max_file_uploads=20, post_max_size=8M, upload_max_filesize=2M)
; sont trop stricts pour un import de plusieurs dizaines de photos en une fois.
max_file_uploads = 200
post_max_size = 400M
upload_max_filesize = 40M
memory_limit = 512M
max_execution_time = 300
